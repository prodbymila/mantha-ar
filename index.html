<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
  :root { --crudo:#efe8d8; --tinta:#1a1a1a; --rojo:#c23a4c; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color:var(--tinta); }
  #ar { position:fixed; inset:0; touch-action:none; }
  html, body { touch-action:none; -webkit-user-select:none; user-select:none; }
  #hint.up { bottom:calc(120px + env(safe-area-inset-bottom)); }
  #ar video { object-fit:cover; }
  .ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; z-index:10; }
  #start { background:var(--crudo); }
  #start h1 { font-size:44px; margin:0; letter-spacing:1px; font-weight:900; -webkit-text-stroke:1.5px var(--tinta); color:#fff; text-shadow:3px 3px 0 var(--tinta); }
  #start p { margin:0; max-width:300px; line-height:1.4; }
  .thumbs img { width:240px; max-width:80vw; border:3px solid var(--tinta); border-radius:14px; transform:rotate(-2deg); }
  button { font:inherit; font-weight:800; font-size:20px; padding:14px 30px; border-radius:40px; border:3px solid var(--tinta); background:var(--rojo); color:#fff; box-shadow:4px 4px 0 var(--tinta); }
  button:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--tinta); }
  #scan { pointer-events:none; display:none; }
  #scan .frame { width:62vmin; height:62vmin; border:3px dashed rgba(255,255,255,.85); border-radius:24px; display:flex; align-items:center; justify-content:center; }
  #scan .tip { color:#fff; background:rgba(0,0,0,.45); padding:8px 14px; border-radius:20px; font-weight:700; }
  #card { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%,140%); transition:transform .45s cubic-bezier(.2,1.4,.4,1); background:var(--crudo); border:3px solid var(--tinta); border-radius:18px; box-shadow:4px 4px 0 var(--tinta); padding:10px 18px; z-index:11; text-align:center; white-space:nowrap; }
  #card.on { transform:translate(-50%,0); }
  #card b { font-size:22px; display:block; }
  #card span { font-size:14px; }
  #err { display:none; background:var(--crudo); }
  #hint { position:fixed; left:50%; bottom:calc(32px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:11; color:#fff; font-weight:800; padding:10px 18px; border-radius:24px;
    background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:none; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.4); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"

</head>
<body>
<div id="ar"></div>

<div id="start" class="ov">
  <h1>MANTHA AR</h1>
  <div class="thumbs"><img src="zona_z1.jpg" alt=""></div>
  <p>Apuntá la cámara a la capa: los dibujos se iluminan. <b>Tocá uno</b> y sale de la tela.</p>
  <button id="go">Abrir cámara</button>
  <p style="font-size:13px;opacity:.6">sin cámara: <a href="?preview=vespa" style="color:inherit">Vespa</a> · <a href="?preview=sk4" style="color:inherit">SK4</a> · <a href="?sim=zA" style="color:inherit">simular capa</a></p>
</div>

<div id="scan" class="ov"><div class="frame"></div><div class="tip">Apuntá a los dibujos de la capa…</div></div>
<div id="hint">Tocá un dibujo</div>
<div id="card"><b id="ct"></b><span id="cs"></span></div>
<div id="err" class="ov"><p id="errmsg"></p><button onclick="location.reload()">Reintentar</button></div>

<script type="module">
import * as THREE from 'three';
import { buildVespa, setupRenderer } from './vespa3d.js?v=5';
import { buildSK4 } from './sk4.js?v=5';
import * as O from './objetos.js?v=7';

const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);

// Objetos 3D: título, ficha e inclinación hacia quien mira (para ver la parte de arriba).
const OBJETOS = {
  lamp:       { build: O.buildLamp, title: 'Lámpara WG24', sub: 'Bauhaus 1923 · Wagenfeld y Jucker', tilt: 0.2 },
  b3:         { build: O.buildB3, title: 'Silla B3', sub: 'Bauhaus 1925 · Marcel Breuer', tilt: 0.3 },
  club:       { build: O.buildClub, title: 'Club Obrero', sub: 'París 1925 · Aleksandr Ródchenko', tilt: 0.45 },
  tatlin:     { build: O.buildTatlin, title: 'Silla de Tatlin', sub: 'Moscú 1927 · Tatlin y Rogozhin', tilt: 0.25 },
  molino:     { build: O.buildMolino, title: 'Molinos Minetti', sub: 'Córdoba 1918', tilt: 0.25 },
  fma:        { build: O.buildFMA, title: 'Fábrica Militar de Aviones', sub: 'Córdoba 1927', tilt: 0.4 },
  bkf:        { build: O.buildBKF, title: 'Silla BKF', sub: '1938 · Grupo Austral', tilt: 0.35 },
  vespa:      { build: buildVespa, title: 'Vespa 98', sub: "Piaggio · Italia 1946 · Corradino D'Ascanio", tilt: 0, yaw: -0.3 },
  eames:      { build: O.buildEames, title: 'Silla Eames', sub: 'EE.UU. 1950 · Charles y Ray Eames', tilt: 0.3 },
  sk4:        { build: buildSK4, title: 'Braun SK4', sub: 'Alemania 1956 · Dieter Rams y Hans Gugelot', tilt: 0.55 },
  r360:       { build: O.buildR360, title: 'Mazda R360 Coupé', sub: 'Japón 1960 · Tsuneji Matsuda', tilt: 0.15, sway: 0.55 },
  walkman:    { build: O.buildWalkman, title: 'Walkman TPS-L2', sub: 'Sony 1979 · Ibuka y Morita', tilt: 0.15 },
  rastrojero: { build: O.buildRastrojero, title: 'Rastrojero', sub: 'IAME · Córdoba 1952', tilt: 0.15, sway: 0.55 },
  ika:        { build: O.buildEstanciera, title: 'IKA Estanciera', sub: 'Córdoba 1957', tilt: 0.15, sway: 0.55 },
  magiclick:  { build: O.buildMagiclick, title: 'Magiclick', sub: 'Aurora 1968 · encendedor piezoeléctrico', tilt: 0.1 },
  motocompo:  { build: O.buildMotocompo, title: 'Motocompo', sub: 'Honda 1981', tilt: 0.15, sway: 0.5 },
  imac:       { build: O.buildIMac, title: 'iMac G3', sub: 'Apple 1998 · Jonathan Ive', tilt: 0.15 },
  gba:        { build: O.buildGBA, title: 'Game Boy Advance', sub: 'Nintendo 2001', tilt: 0.1 },
  r12:        { build: O.buildR12, title: 'Renault 12', sub: 'Gaston Juchet 1969 · IKA-Renault Córdoba 1971–94', tilt: 0.15, sway: 0.55 },
  espalditas: { build: O.buildEspalditas, title: 'Espalditas', sub: 'Diana Cabeza 2017 · Planetario de Buenos Aires', tilt: 0.3 },
  // centro: las tres etapas de la técnica de Ortega y Gasset
  fuego:      { build: O.buildFuego, title: 'Fuego', sub: 'Técnica del azar', tilt: 0.3 },
  piedra:     { build: O.buildPiedra, title: 'Piedra tallada', sub: 'Técnica del azar', tilt: 0.4 },
  hacha:      { build: O.buildHacha, title: 'Hacha de mano', sub: 'Técnica del azar', tilt: 0.2 },
  vasija:     { build: O.buildVasija, title: 'Vasija de barro', sub: 'Técnica del artesano', tilt: 0.2 },
  yunque:     { build: O.buildYunque, title: 'Yunque del herrero', sub: 'Técnica del artesano', tilt: 0.3 },
  telarm:     { build: O.buildTelarManual, title: 'Telar manual', sub: 'Técnica del artesano', tilt: 0.15 },
  telarmec:   { build: O.buildWatt, title: 'Máquina de vapor', sub: 'James Watt 1769 · Técnica del técnico', tilt: 0.25 },
  crystal:    { build: O.buildCrystal, title: 'Crystal Palace', sub: 'Londres 1851 · Joseph Paxton', tilt: 0.45 },
  foco:       { build: O.buildFoco, title: 'Lamparita incandescente', sub: 'Edison 1879 · Técnica del técnico', tilt: 0.1 },
};

// Zonas = marcadores (orden de zonas.mind). capa.json tiene, en píxeles de la foto de la capa extendida,
// el rectángulo de cada zona y la caja de cada dibujo. Cada zona muestra los dibujos que caen en ella
// o cerca (aunque se salgan del recorte): así da igual qué zona reconozca la cámara.
const CAPA = await (await fetch('./capa.json?v=6')).json();
const MARGEN = 260;
const ZONAS = CAPA.zonas.map(([id, x0, y0, x1, y1]) => {
  const W = x1 - x0, cx0 = (x0 + x1) / 2, cy0 = (y0 + y1) / 2;
  const dibujos = Object.entries(CAPA.dibujos).filter(([k, [a, b, c, d]]) => {
    const mx = (a + c) / 2, my = (b + d) / 2;
    return OBJETOS[k] && mx > x0 - MARGEN && mx < x1 + MARGEN && my > y0 - MARGEN && my < y1 + MARGEN;
  }).map(([k, [a, b, c, d]]) => ({ obj: k, cx: ((a + c) / 2 - cx0) / W, cy: (cy0 - (b + d) / 2) / W, w: (c - a) / W, h: (d - b) / W }));
  return { id, img: `zona_${id}.jpg`, aspect: (y1 - y0) / W, dibujos };
});

function showCard(o) {
  if (o) { $('ct').textContent = o.title; $('cs').textContent = o.sub; }
  $('card').classList.toggle('on', !!o);
}

// ---------- modelo que sale de la tela ----------
let ACTIVO = null;                         // modelo abierto ahora (el que gira con el dedo)
const UI = { girado: false, refresh: null };
function mount(o, fitW) {
  const holder = new THREE.Group(), spin = new THREE.Group(), model = o.build();
  // centrar el modelo y escalarlo para que mida ~2 veces el dibujo (con tope, para no tapar todo)
  const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  model.position.sub(c);
  const big = Math.max(size.x, size.y * 1.2);
  const base = fitW ? Math.min((1.9 * fitW) / big, 0.55 / Math.max(size.x, size.y, size.z)) : 1;
  holder.rotation.x = o.tilt || 0; spin.add(model); holder.add(spin);
  holder.userData.depth = size.z * base;
  let t0 = null, visible = false, last = performance.now(), cur = 0;
  const back = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2); // ease-out con rebote
  // giro con el dedo: yaw (horizontal) y pitch (vertical), con inercia al soltar
  const YAW0 = o.yaw ?? -0.45;
  let yaw = YAW0, pitch = 0, vYaw = 0, vPitch = 0, dragging = false;
  return {
    holder, base,
    get visible() { return visible; },
    show() { visible = true; t0 = performance.now(); yaw = YAW0; pitch = 0; vYaw = vPitch = 0; model.userData.reset?.(); },
    hide() { visible = false; },
    grab() { dragging = true; vYaw = vPitch = 0; },
    drag(dx, dy) {
      const ky = 0.012, kp = 0.009;
      yaw += dx * ky; pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * kp));
      vYaw = dx * ky; vPitch = dy * kp;
    },
    release() { dragging = false; },
    tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const t = t0 ? (now - t0) / 1000 : 0;
      cur = visible ? back(Math.min(1, t / 0.9)) : Math.max(0, cur - dt * 6);   // al ocultar se achica
      holder.visible = cur > 0.002;
      spin.scale.setScalar(base * Math.max(cur, 0.001));
      if (!dragging) {                                   // inercia que se frena sola
        yaw += vYaw; pitch = Math.max(-1.2, Math.min(1.2, pitch + vPitch));
        vYaw *= 0.92; vPitch *= 0.92;
      }
      spin.rotation.set(pitch, yaw, 0, 'XYZ');
      if (visible) model.userData.update?.(now, t, dt);
    },
  };
}

// ---------- recuadro glassy sobre cada dibujo ----------
const PAD = 0.035;
function glassMaterial(w, h) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uSize: { value: new THREE.Vector2(w, h) }, uTime: { value: 0 }, uSel: { value: 0 }, uDim: { value: 0 }, uOn: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec2 uSize; uniform float uTime, uSel, uDim, uOn; varying vec2 vUv;
      float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.0)) + min(max(q.x,q.y),0.0) - r; }
      void main(){
        vec2 full = uSize + 2.0 * ${PAD.toFixed(3)};
        vec2 p = (vUv - 0.5) * full;
        float d = sdRound(p, uSize * 0.5, 0.035);
        float inside = 1.0 - smoothstep(-0.002, 0.002, d);
        float fill = inside * (0.14 + 0.1 * (1.0 - vUv.y));                  // vidrio esmerilado, más claro abajo
        float border = 1.0 - smoothstep(0.003, 0.0065, abs(d));               // canto
        float glow = (1.0 - inside) * exp(-max(d, 0.0) * 55.0) * 0.35;        // halo exterior
        float shadow = (1.0 - smoothstep(0.004, 0.022, d)) * smoothstep(0.002, 0.007, d); // sombra que lo despega de la tela
        float k = mod(uTime * 0.28, 1.6) - 0.3;                                // reflejo que barre en diagonal
        float s = (p.x / full.x + p.y / full.y * 0.7) - (k * 2.0 - 1.0);
        float sheen = inside * (1.0 - smoothstep(0.0, 0.07, abs(s))) * 0.4;
        float pulse = 0.8 + 0.2 * sin(uTime * 3.0);
        vec3 col = mix(vec3(1.0), vec3(0.95, 0.27, 0.36), uSel);
        float fade = uOn * (1.0 - 0.65 * uDim);
        float wa = clamp(fill * (1.0 - 0.6 * uSel) + border * pulse + glow * (0.5 + uSel) + sheen, 0.0, 1.0) * fade;
        float da = shadow * 0.45 * fade;
        float a = wa + da * (1.0 - wa);
        vec3 rgb = (col * wa + vec3(0.04, 0.04, 0.06) * da * (1.0 - wa)) / max(a, 0.001);
        gl_FragColor = vec4(rgb, a);
      }`,
  });
}

// Arma una zona dentro de un grupo anclado al marcador. Devuelve su lógica.
function buildZone(zona, group) {
  const items = zona.dibujos.map((d) => {
    const o = OBJETOS[d.obj];
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(d.w + 2 * PAD, d.h + 2 * PAD), glassMaterial(d.w, d.h));
    mesh.position.set(d.cx, d.cy, 0.004); mesh.userData.d = d; group.add(mesh);
    const m = mount(o, d.w); m.holder.position.set(d.cx, d.cy, 0.08 + m.holder.userData.depth / 2); group.add(m.holder);
    return { d, o, mesh, m };
  });
  let on = false, sel = null, tOn = 0;
  const api = {
    items,
    found() { on = true; if (sel) { sel.m.show(); ACTIVO = sel.m; } updateUI(); },
    lost() { on = false; items.forEach((it) => it.m.hide()); if (sel && ACTIVO === sel.m) ACTIVO = null; updateUI(); },
    select(it) {
      if (sel === it) { it.m.hide(); sel = null; ACTIVO = null; }
      else { if (sel) sel.m.hide(); sel = it; it.m.show(); ACTIVO = it.m; navigator.vibrate?.(20); }
      updateUI();
    },
    tick(now) {
      tOn += ((on ? 1 : 0) - tOn) * 0.15;
      for (const it of items) {
        const u = it.mesh.material.uniforms;
        u.uTime.value = now / 1000; u.uOn.value = tOn;
        u.uSel.value += ((sel === it ? 1 : 0) - u.uSel.value) * 0.15;
        u.uDim.value += ((sel && sel !== it ? 1 : 0) - u.uDim.value) * 0.15;
        it.m.tick(now);
      }
    },
  };
  function updateUI() {
    showCard(on && sel ? sel.o : null);
    UI.refresh = updateUI;
    const h = $('hint');
    if (on && !sel) { h.textContent = 'Tocá un dibujo'; h.classList.remove('up'); h.style.display = 'block'; }
    else if (on && sel && !UI.girado) { h.textContent = 'Deslizá el dedo para girarlo'; h.classList.add('up'); h.style.display = 'block'; }
    else h.style.display = 'none';
  }
  return api;
}

// Toque: raycast contra los recuadros; si dos se pisan gana el más cercano a su centro.
function enableTap(dom, camera, zonas) {
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null, lastP = null, dragging = false;
  addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; lastP = [e.clientX, e.clientY]; dragging = false; });
  addEventListener('pointermove', (e) => {
    if (!down || !ACTIVO || !ACTIVO.visible) return;
    if (!dragging && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) { dragging = true; ACTIVO.grab(); }
    if (dragging) {
      ACTIVO.drag(e.clientX - lastP[0], e.clientY - lastP[1]);
      if (!UI.girado) { UI.girado = true; UI.refresh?.(); }
    }
    lastP = [e.clientX, e.clientY];
  });
  const end = (e) => {
    if (!down) return;
    const wasDrag = dragging || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 12;
    if (dragging) ACTIVO?.release();
    down = null; dragging = false;
    if (wasDrag || e.type === 'pointercancel') return;
    const r = dom.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    let best = null;
    for (const z of zonas) for (const it of z.items) {
      if (!it.mesh.material.uniforms.uOn.value || it.mesh.material.uniforms.uOn.value < 0.5) continue;
      const hit = ray.intersectObject(it.mesh)[0];
      if (!hit) continue;
      const lp = it.mesh.worldToLocal(hit.point.clone());
      const score = Math.max(Math.abs(lp.x) / it.d.w, Math.abs(lp.y) / it.d.h);
      if (!best || score < best.score) best = { z, it, score };
    }
    if (best) best.z.select(best.it);
  };
  addEventListener('pointerup', end);
  addEventListener('pointercancel', end);
}

if (qs.has('preview')) {
  // ver un objeto suelto, sin cámara
  $('start').style.display = 'none';
  const id = OBJETOS[qs.get('preview')] ? qs.get('preview') : 'vespa', o = OBJETOS[id];
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
  r.setClearColor(0xefe8d8); $('ar').appendChild(r.domElement);
  const scene = new THREE.Scene(); setupRenderer(r, scene);
  const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 50);
  cam.position.set(1.6, 1.3, 3.2);
  const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, 0.4, 0); ctl.update(); window._view = { cam, ctl };
  const m = mount({ ...o, tilt: 0 }); m.holder.position.y = 0.45; scene.add(m.holder); m.show();
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.4, 48), new THREE.MeshBasicMaterial({ color: 0xe2d9c4 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.035; scene.add(floor);
  showCard(o);
  addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
  r.setAnimationLoop((now) => { m.tick(now); r.render(scene, cam); });
} else if (qs.has('sim')) {
  // simulación: la foto de la capa como si fuera la cámara, para probar los toques
  $('start').style.display = 'none';
  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight); r.setClearColor(0x222222);
  $('ar').appendChild(r.domElement);
  const scene = new THREE.Scene(); setupRenderer(r, scene);
  const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 50);
  cam.position.set(0.15, -0.35, 1.25); cam.lookAt(0, 0, 0);
  const zona = ZONAS.find((z) => z.id === qs.get('sim')) || ZONAS[0], group = new THREE.Group(); scene.add(group);
  const tex = new THREE.TextureLoader().load(zona.img); tex.encoding = THREE.sRGBEncoding;
  group.add(new THREE.Mesh(new THREE.PlaneGeometry(1, zona.aspect), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false })));
  const z = buildZone(zona, group); z.found(); window._zone = z;
  enableTap(r.domElement, cam, [z]);
  addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
  r.setAnimationLoop((now) => { z.tick(now); r.render(scene, cam); });
} else {
  $('go').onclick = async () => {
    $('go').disabled = true; $('go').textContent = 'Cargando…';
    try {
      const { MindARThree } = await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js');
      const mind = new MindARThree({
        container: $('ar'), imageTargetSrc: './zonas.mind?v=6', maxTrack: 1,
        uiLoading: 'no', uiScanning: 'no', uiError: 'no',
        filterMinCF: 0.0001, filterBeta: 0.001, missTolerance: 10, warmupTolerance: 3,
      });
      const { renderer, scene, camera } = mind;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      setupRenderer(renderer, scene);
      const zonas = ZONAS.map((zona, i) => {
        const anchor = mind.addAnchor(i), z = buildZone(zona, anchor.group);
        anchor.onTargetFound = () => { z.found(); $('scan').style.display = 'none'; };
        anchor.onTargetLost = () => { z.lost(); $('scan').style.display = 'flex'; };
        return z;
      });
      enableTap(renderer.domElement, camera, zonas);
      await mind.start();
      $('start').style.display = 'none'; $('scan').style.display = 'flex';
      renderer.setAnimationLoop((now) => { zonas.forEach((z) => z.tick(now)); renderer.render(scene, camera); });
    } catch (e) {
      console.error(e);
      $('start').style.display = 'none'; $('err').style.display = 'flex';
      $('errmsg').textContent = 'No pude abrir la cámara. Revisá que el navegador tenga permiso de cámara (Ajustes → Safari → Cámara) y que la página esté en https.';
    }
  };
}
</script>
</body>
</html>
